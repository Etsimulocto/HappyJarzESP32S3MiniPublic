name: Publish HAPPY JARZ Web Studio
on:
  workflow_dispatch:
  # One-time public testing deployment: an explicit marker commit triggers Pages.
  # Normal feature-branch commits do not deploy automatically.
  push:
    branches:
      - feature/dnd-next-module
    paths:
      - .github/site-deploy-test-2026-11-22.txt
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: happyjarz-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-controller
      - id: deployment
        uses: actions/deploy-pages@v4
